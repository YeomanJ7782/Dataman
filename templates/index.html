<!DOCTYPE html>
<html>
<head>
    <title>DataMan</title>
</head>

{% if session.get('user') %}
    <p>Welcome, {{ session['user'] }}!</p>
    <a href="/logout">Logout</a>
{% else %}
    <a href="/login">Login</a>
    <a href="/register">Register</a>
{% endif %}

<body>
    <h1>Welcome to DataMan</h1>

    

    <form action="/answer_checker" method="get">
    <label>Select Difficulty:</label><br><br>

    <input type="radio" name="difficulty" value="easy" checked> Easy<br>
    <input type="radio" name="difficulty" value="medium"> Medium<br>
    <input type="radio" name="difficulty" value="hard"> Hard<br><br>

    <button type="submit">Start Game</button>
</form>

<br><br>
<a href="/number_guesser">Play Number Guesser</a>

<br><br>
<a href="/dashboard">View Dashboard</a>

<br><br>
<a href="/speed_round">Play Speed Round</a>

</body>
</html>
