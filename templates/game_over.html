<!DOCTYPE html>
<html>
<head>
    <title>Game Over</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

<h1>Game Over!</h1>
<h2>Your Score: {{ score }} / 5</h2>

<a href="/answer_checker">
    <button>Play Again</button>
</a>

<a href="/">
    <button>Back to Home</button>
</a>

</body>
</html>
